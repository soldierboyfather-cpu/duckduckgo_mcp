name: Deploy to Render on Tag

on:
  push:
    tags:
      - 'v*'        # Triggers on any tag like v1.0.0, v2.1.3, v1.0.0-beta

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract tag info
        id: tag_info
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          BRANCH=$(git branch -r --contains "$GITHUB_SHA" | grep -v HEAD | head -1 | sed 's/  origin\///')
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "commit=$GITHUB_SHA" >> $GITHUB_OUTPUT
          echo "::notice::Deploying tag $TAG_NAME from branch $BRANCH"

      - name: Trigger Render Deploy
        id: render_deploy
        run: |
          echo "🚀 Triggering Render deployment for tag: ${{ steps.tag_info.outputs.tag }}"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Render deployment triggered successfully!"
            echo "deploy_id=$(echo $BODY | python3 -c "import sys,json; print(json.load(sys.stdin).get('id','N/A'))" 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to trigger Render deployment. HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Post deployment summary
        if: success()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field       | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag**     | \`${{ steps.tag_info.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch**  | \`${{ steps.tag_info.outputs.branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit**  | \`${{ steps.tag_info.outputs.commit }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status**  | ✅ Triggered |" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Tag \`${{ steps.tag_info.outputs.tag }}\` failed to trigger Render deployment." >> $GITHUB_STEP_SUMMARY
          echo "Check the **RENDER_DEPLOY_HOOK_URL** secret is correctly set in your repository settings." >> $GITHUB_STEP_SUMMARY
