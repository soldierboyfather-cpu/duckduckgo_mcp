[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as live integration tests (deselect with '-m not integration')",
]
addopts = "-v --cov=server --cov-report=term-missing -m 'not integration'"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"
